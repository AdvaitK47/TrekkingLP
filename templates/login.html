{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="clean-table-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="status-pill open mb-2">Expedition Gateway</span>
                    <h3 class="text-white fw-bold mb-1">Access Account</h3>
                    <p class="text-white-50 small mb-0">Sign in to your trekker, staff, or commander portal.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white small">Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="e.g. admin or trekker" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white small">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-orange w-100 py-2 fw-bold">Sign In</button>
                </form>

                <p class="mt-4 mb-0 text-center small text-white-50">
                    New to expeditions? <a href="{{ url_for('register') }}" class="text-warning text-decoration-none fw-semibold">Register account</a>
                </p>
                <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 text-center mt-3 small text-muted">
                    Default Admin: <strong class="text-info">admin</strong> / <strong class="text-info">admin123</strong>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
