{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="container py-3">
    <div class="mb-4">
        <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-white btn-sm mb-2 rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Portal
        </a>
        <h3 class="text-white fw-bold mb-0">Trekker Safety &amp; Profile</h3>
        <p class="text-white-50 small mb-0">Update contact information and emergency dispatch records.</p>
    </div>

    <div class="clean-table-card p-4" style="max-width:550px;">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white small">Full Legal Name</label>
                <input type="text" name="name" class="form-control bg-dark text-white border-secondary" value="{{ current_user.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white small">Email Address</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" value="{{ current_user.email or '' }}">
            </div>
            <div class="mb-4">
                <label class="form-label text-white small">Emergency Contact Number (ICE)</label>
                <input type="text" name="contact" class="form-control bg-dark text-white border-secondary" value="{{ current_user.contact or '' }}" placeholder="+1-555-0192 (Family / ICE)">
            </div>
            <button type="submit" class="btn btn-orange px-4 py-2 rounded-pill fw-bold">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
